services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-watchbox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Coolify}
      POSTGRES_DB: ${POSTGRES_DB:-watchbox}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in Coolify}", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a $$REDIS_PASSWORD ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    restart: "no"
    build:
      context: .
      target: migrate
      args:
        VITE_SERVER_URL: ${VITE_SERVER_URL:?Set VITE_SERVER_URL in Coolify}
        VITE_WEB_URL: ${VITE_WEB_URL:?Set VITE_WEB_URL in Coolify}
        VITE_APP_NAME: ${VITE_APP_NAME:-Watchbox}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-watchbox}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-watchbox}
    depends_on:
      postgres:
        condition: service_healthy

  server:
    build:
      context: .
      target: server
      args:
        VITE_SERVER_URL: ${VITE_SERVER_URL:?Set VITE_SERVER_URL in Coolify}
        VITE_WEB_URL: ${VITE_WEB_URL:?Set VITE_WEB_URL in Coolify}
        VITE_APP_NAME: ${VITE_APP_NAME:-Watchbox}
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-watchbox}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-watchbox}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      STORAGE_PATH: /data
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in Coolify}
      BETTER_AUTH_URL: ${VITE_SERVER_URL:?Set VITE_SERVER_URL in Coolify}
      CORS_ORIGIN: ${VITE_WEB_URL:?Set VITE_WEB_URL in Coolify}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
      TRUST_PROXY: "true"
    volumes:
      - media-data:/data
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      target: worker
      args:
        VITE_SERVER_URL: ${VITE_SERVER_URL:?Set VITE_SERVER_URL in Coolify}
        VITE_WEB_URL: ${VITE_WEB_URL:?Set VITE_WEB_URL in Coolify}
        VITE_APP_NAME: ${VITE_APP_NAME:-Watchbox}
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-watchbox}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-watchbox}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      STORAGE_PATH: /data
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in Coolify}
      BETTER_AUTH_URL: ${VITE_SERVER_URL:?Set VITE_SERVER_URL in Coolify}
      CORS_ORIGIN: ${VITE_WEB_URL:?Set VITE_WEB_URL in Coolify}
      FFMPEG_PATH: ffmpeg
      FFPROBE_PATH: ffprobe
      CONCURRENCY: ${CONCURRENCY:-2}
      DELETE_RAW_AFTER_TRANSCODE: ${DELETE_RAW_AFTER_TRANSCODE:-false}
    volumes:
      - media-data:/data
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      target: web
      args:
        VITE_SERVER_URL: ${VITE_SERVER_URL:?Set VITE_SERVER_URL in Coolify}
        VITE_WEB_URL: ${VITE_WEB_URL:?Set VITE_WEB_URL in Coolify}
        VITE_APP_NAME: ${VITE_APP_NAME:-Watchbox}
    depends_on:
      server:
        condition: service_started

volumes:
  postgres-data:
  redis-data:
  media-data:
